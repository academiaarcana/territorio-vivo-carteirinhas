name: Publicar Território Vivo no GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Validar JavaScript
        run: |
          node --check app.js
          node --check config.js
          node --check enhancements.js
          node --check multiunit.js
          node --check network-context.js
          node --check public-site.js

      - name: Validar arquivos essenciais
        run: |
          test -f index.html
          test -f styles.css
          test -f public-site.css
          test -f .nojekyll
          grep -q "@supabase/supabase-js" index.html
          grep -q "public-site.js" config.js
          ! grep -R "service_role" . --exclude-dir=.git

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Preparar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
