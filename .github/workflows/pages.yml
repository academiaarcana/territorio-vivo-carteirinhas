name: Publicar Território Vivo no GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Validar arquitetura
        run: npm run check

      - name: Validar sintaxe JavaScript
        run: |
          node --check config.js
          find src -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check

      - name: Verificar configuração pública
        run: |
          test -f index.html
          test -f src/main.js
          test -f src/styles/foundation.css
          test -f .nojekyll
          grep -q "@supabase/supabase-js" index.html
          grep -q "type=\"module\"" index.html
          ! grep -R "service_role" src config.js index.html --exclude-dir=.git

      - name: Testar fronteiras públicas do Supabase
        shell: bash
        run: |
          set -euo pipefail
          SUPABASE_URL=$(node -e "const s=require('fs').readFileSync('config.js','utf8'); const m=s.match(/supabaseUrl:\s*'([^']+)'/); if(!m) process.exit(1); process.stdout.write(m[1])")
          SUPABASE_KEY=$(node -e "const s=require('fs').readFileSync('config.js','utf8'); const m=s.match(/supabasePublishableKey:\s*'([^']+)'/); if(!m) process.exit(1); process.stdout.write(m[1])")

          for TABLE in municipalities health_units teams; do
            CODE=$(curl --silent --show-error --output "/tmp/${TABLE}.json" --write-out "%{http_code}" \
              "${SUPABASE_URL}/rest/v1/${TABLE}?select=*&limit=20" \
              -H "apikey: ${SUPABASE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_KEY}")
            test "${CODE}" = "200"
          done

          for PRIVATE_TABLE in profiles territory_points microareas; do
            PRIVATE_CODE=$(curl --silent --show-error --output "/tmp/${PRIVATE_TABLE}.json" --write-out "%{http_code}" \
              "${SUPABASE_URL}/rest/v1/${PRIVATE_TABLE}?select=id&limit=1" \
              -H "apikey: ${SUPABASE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_KEY}")
            case "${PRIVATE_CODE}" in
              401|403) ;;
              *)
                echo "${PRIVATE_TABLE} deveria rejeitar acesso anônimo com 401/403, mas respondeu HTTP ${PRIVATE_CODE}."
                cat "/tmp/${PRIVATE_TABLE}.json" || true
                exit 1
                ;;
            esac
          done

          echo "Catálogo público acessível; profiles, territory_points e microareas rejeitam acesso anônimo com status de autorização esperado."

      - name: Validar configuração pública do Auth
        shell: bash
        run: |
          set -euo pipefail
          SUPABASE_URL=$(node -e "const s=require('fs').readFileSync('config.js','utf8'); const m=s.match(/supabaseUrl:\s*'([^']+)'/); if(!m) process.exit(1); process.stdout.write(m[1])")
          SUPABASE_KEY=$(node -e "const s=require('fs').readFileSync('config.js','utf8'); const m=s.match(/supabasePublishableKey:\s*'([^']+)'/); if(!m) process.exit(1); process.stdout.write(m[1])")

          AUTH_CODE=$(curl --silent --show-error --output /tmp/auth-settings.json --write-out "%{http_code}" \
            "${SUPABASE_URL}/auth/v1/settings" \
            -H "apikey: ${SUPABASE_KEY}")
          test "${AUTH_CODE}" = "200"

          node <<'NODE'
          const fs = require('fs');
          const settings = JSON.parse(fs.readFileSync('/tmp/auth-settings.json', 'utf8'));
          if (settings.disable_signup !== false) {
            throw new Error('Supabase Auth está com novos cadastros desabilitados.');
          }
          if (settings.external?.email !== true) {
            throw new Error('Supabase Auth está com autenticação por e-mail desabilitada.');
          }
          if (settings.mailer_autoconfirm !== false) {
            throw new Error('Supabase Auth precisa exigir confirmação de e-mail antes da homologação.');
          }
          console.log('Auth público OK: cadastro e e-mail habilitados; confirmação de e-mail obrigatória.');
          NODE

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Preparar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
